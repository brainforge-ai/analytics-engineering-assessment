repos:
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: uv run sqlfluff lint
        language: system
        files: ^(models|macros|tests|analyses)/.*\.sql$
        pass_filenames: true

      - id: sqlfluff-fix
        name: sqlfluff fix
        entry: uv run sqlfluff fix
        language: system
        files: ^(models|macros|tests|analyses)/.*\.sql$
        pass_filenames: true
        stages: [manual]
