version: 2

# Property files under seed-paths require `seeds` to be a list (see dbt parse). Project-wide
# seed config (e.g. +schema) stays in dbt_project.yml under seeds.ae_assessment.
seeds:
  - name: products
    description: Product catalog rows loaded from CSV seed.
    columns:
      - name: product_id
        data_type: varchar
        description: Primary key for the product.
      - name: name
        data_type: varchar
        description: Product display name.
      - name: category
        data_type: varchar
        description: Merchandising or product category.
      - name: unit_price
        data_type: decimal
        description: Price per unit in the given currency context.

  - name: customers
    description: Customer dimension rows loaded from CSV seed.
    columns:
      - name: customer_id
        data_type: varchar
        description: Primary key for the customer.
      - name: email
        data_type: varchar
        description: Customer email address; may require deduplication in staging.
      - name: country
        data_type: varchar
        description: Country associated with the customer account or signup.
      - name: created_at
        data_type: varchar
        description: Timestamp when the customer record was created.

  - name: orders
    description: Order fact rows loaded from CSV seed.
    columns:
      - name: order_id
        data_type: varchar
        description: Business key for the order; watch for duplicates by updated_at.
      - name: customer_id
        data_type: varchar
        description: Customer who placed the order.
      - name: order_date
        data_type: varchar
        description: Date of the order; validate for invalid or future dates in staging.
      - name: status
        data_type: varchar
        description: Order lifecycle status (e.g. completed, pending, cancelled, shipped, refunded).
      - name: total_amount
        data_type: decimal
        description: Monetary total for the order; handle nulls in staging.
      - name: currency
        data_type: varchar
        description: ISO or business code for the currency of total_amount.
      - name: updated_at
        data_type: varchar
        description: Row update timestamp; use to resolve duplicate order_id rows.
