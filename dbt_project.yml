# Analytics Engineering Assessment — dbt project
# Use with dbt-duckdb (pip install dbt-duckdb)

name: 'ae_assessment'
version: '1.0.0'
config-version: 2

profile: 'ae_assessment'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Seeds land in the custom schema `raw` (default macro → {target.schema}_raw). Staging models
# read the same relations via sources named `raw` in models/staging/schema.yml, e.g.
#   {{ source('raw', 'products') }}
seeds:
  ae_assessment:
    +schema: raw

# Project-level defaults for declared sources (see models/staging/schema.yml).
sources:
  ae_assessment:
    +enabled: true

models:
  ae_assessment:
    +materialized: view
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts
      +materialized: table

tests:
  ae_assessment:
    +severity: error
