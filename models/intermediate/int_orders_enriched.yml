version: 2

models:
  - name: int_orders_enriched
    description: |
      Reusable order model that combines cleaned orders with customer geography (country).

      It also adds monthly reporting fields and a reusable valid-order flag for
      downstream marts.
      
    meta:
      table_grain: one row per order_id after staged order deduplication, with customer country attributes joined in.
      
      source_data_quality_assumptions:
        - order_id - remains one row per staged order after the staging deduplication logic has been applied.
        - customer_id - assumed to match a staged customer row so customer country attributes can be joined in for downstream reporting.
        - order_date - assumed to be the cleaned staged order date used for monthly derivations.
        - total_amount - assumed to be the cleaned staged order amount used in downstream metrics.

    columns:
      # source table columns
      - name: order_id
        description: Unique identifier for the order.

      - name: customer_id
        description: Identifier for the customer who placed the order.

      - name: country_code
        description: Customer country code used for country-level reporting.

      - name: country_name
        description: Business-friendly customer country name used in reporting outputs.

      - name: order_date
        description: Cleaned order date used for time-based reporting.

      - name: order_year_month
        description: Reporting month derived from the order date in YYYY-MM format.

      - name: order_month_start
        description: First day of the order month, used for monthly comparisons and cohort analysis.

      - name: status
        description: Cleaned business status of the order.

      - name: total_amount
        description: Cleaned order amount used in downstream revenue metrics.

      - name: currency
        description: Standardized currency code for the order amount.

      - name: updated_at
        description: Source-system timestamp showing when the order was last updated.

      # flag & debug columns
      - name: is_valid_order
        description: Flag showing whether the order should be included in downstream business reporting.

      # enrichment columns
