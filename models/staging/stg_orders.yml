version: 2

models:
  - name: stg_orders
    description: |
      Order staging model built from the raw order seed.

      Grain: one row per order_id.

      This model keeps one row per `order_id`, safely parses typed fields used
      downstream, and surfaces data quality flags for invalid dates, missing
      amounts, duplicate orders, and anomalous cancelled-order amounts.
    meta:
      data_quality_assumptions:
        - order_id - assume there may be duplicates, assume order_id is valid format.
        - customer_id - assume customer_id may not link/ exist in customers input table. assume customer_id is valid format
        - order_date - assume 
        - status - assume status can only be 1 of 5 inputs - pending, refunded, completed, shipped, cancelled
        - total_amount - 
        - currency - Assume always USD, add warning test for future
        - updated_at - 
      suggested_future_improvements:
        - add order id format test


    columns:
      - name: order_id
        description: Unique order identifier after duplicate raw order rows are resolved.
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Customer identifier carried forward from the canonical staged order row.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_date
        description: Parsed order date for the staged order record; invalid, future, and too-old values are surfaced through companion flags.

      - name: status
        description: Lowercased order status from the raw seed.

      - name: total_amount
        description: Parsed order amount; blank raw amounts remain null and are flagged in `has_missing_total_amount`.

      - name: currency
        description: Uppercased order currency code.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USD']

      - name: updated_at
        description: Parsed update date used to select the canonical row when duplicate order ids exist.

      - name: had_duplicate_order_id
        description: Boolean flag showing whether the raw seed contained more than one row for the order id.

      - name: duplicate_order_id_count
        description: Number of raw order rows that shared the same order id.

      - name: has_invalid_order_date
        description: Boolean flag showing whether the raw `order_date` could not be parsed as a valid date.

      - name: has_invalid_updated_at
        description: Boolean flag showing whether the raw `updated_at` value could not be parsed as a valid date.

      - name: has_missing_total_amount
        description: Boolean flag showing whether the raw `total_amount` field was blank.

      - name: has_future_order_date
        description: Boolean flag showing whether the parsed order date falls after the expected Jan-Mar 2024 seed window.

      - name: has_too_old_order_date
        description: Boolean flag showing whether the parsed order date falls before the expected 2024 seed window.

      - name: has_near_zero_cancelled_amount
        description: Boolean flag showing whether a cancelled order carries a near-zero amount at or below 1.

      - name: is_valid_order
        description: Convenience flag showing whether the staged order passes the core date and amount quality checks.
