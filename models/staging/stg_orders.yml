version: 2

models:
  - name: stg_orders
    description: |
      Order staging model built from the raw order seed.

      Grain: one row per order_id.

      This model keeps one row per `order_id`, safely parses typed fields used
      downstream, and surfaces data quality flags for invalid dates, missing
      amounts, duplicate orders, and anomalous cancelled-order amounts.
    meta:
      source_data_quality_assumptions:
        - order_id - assume there may be duplicates, assume order_id is valid format.
        - customer_id - assume customer_id may not link/ exist in customers input table. assume customer_id is valid format
        - order_date - assume date that order_id was placed
        - status - assume only options are ['pending', 'refunded', 'completed', 'shipped', 'cancelled']
        - total_amount - assume null is a "missing" amount
        - currency - Assume always USD
        - updated_at - assume this is source systems timestamp for order record

      possible_future_improvements:
        - Add levels (warn vs error) for dbt tests
        - add order id format test


    columns:
      # source table columns
      - name: order_id
        description: Unique order identifier after duplicate raw order rows are resolved.
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Customer identifier carried forward from the primary order row.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_date
        description: Date that order id was originally created.

      - name: status
        description: Order id status, can be ['pending', 'refunded', 'completed', 'shipped', 'cancelled']
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pending', 'refunded', 'completed', 'shipped', 'cancelled']

      - name: total_amount
        description: Parsed order amount; blank raw amounts remain null and are flagged in `has_missing_total_amount`.

      - name: currency
        description: Uppercased order currency code.
        tests:
          - not_null
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['USD']

      - name: updated_at
        description: Last time order id row was updated in source system. 


      # flag & debug columns
      - name: had_duplicate_order_id
        description: Boolean flag - true if order_id is duplicate in source orders data. 

      - name: duplicate_order_id_count
        description: Count of order_id appearances in source order data. 

      - name: has_invalid_order_date
        description: Boolean flag - true if order_date is a valid date format. 

      - name: has_invalid_updated_at
        description: Boolean flag - true if updated_at is a valid date format. 

      - name: has_missing_total_amount
        description: Boolean flag - true if order_id is missing total amount. 

      - name: has_future_order_date
        description: Boolean flag - true if 

      - name: has_too_old_order_date
        description: Boolean flag showing whether the parsed order date falls before the expected 2024 seed window.

      - name: has_near_zero_cancelled_amount
        description: Boolean flag showing whether a cancelled order carries a near-zero amount at or below 1.

      - name: is_valid_order
        description: Convenience flag showing whether the staged order passes the core date and amount quality checks.

      # enrichment columns
