version: 2

models:
  - name: stg_customers
    description: |
      Customer staging model built from the raw customer seed.


      Customers are dedeuplicated based on email, choosing the `customer_id` with earlist `created_at` date.
      Enrich with country name for country code.

      Final table grain: one row per normalized email.
    meta:
      data_quality_assumptions:
        - customer_id - is valid format from source, likely unique but test anyway for safety. 
        - email - is valid format from source, but normalized with `trim()` and `lower()` for duplicate detection
        - country - should be ISO 3166-1 alpha-2
        - created_at - date is valid format from source, 
      suggested_improvements:
        - Test customer_id format
        - Test date validity of `created_at`
        - Add test for malformed emails
        - Add tests for null or malformed `created_at` values.

    columns:
      - name: customer_id
        description: Unique customer identifier number.
        tests:
          - not_null
          - unique

      - name: email
        description: Customer email, normalized with trim, force lowercase.
        tests:
          - not_null
          - unique

      - name: country_code
        description: Customer 2-letter country code.
        tests:
          # not_null test, as relationship test will not fail on null child values
          - not_null
          - relationships:
              arguments:
                to: ref('country_codes')
                field: country_code

      - name: country_name
        description: Business-friendly country name.

      - name: created_at
        description: Customer creation date.

      - name: has_duplicate_email
        description: Flag to show if multiple customer id's sharing an email

      - name: duplicate_email_count
        description: Number of customer records that share the same email.
