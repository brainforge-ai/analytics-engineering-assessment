version: 2

models:
  - name: stg_customers
    description: |
      Customer staging model built from the raw customer seed.

      Final table grain: one row per customer_id.

      This model normalizes email and country fields, preserves every raw
      customer_id, and surfaces duplicate-email metadata for downstream use.

      Enriches by adding business-friendly country name.
    meta:
      data_quality_assumptions:
        - customer_id - preserved at the source grain and expected to remain unique in staging.
        - email - normalized with `trim()` and `lower()` before duplicate detection so duplicate-email records can be counted and ranked consistently.
        - country - standardized to uppercase, with raw `UK` values normalized to `GB` so the code aligns to the country-code reference seed.
        - created_at - used to rank records within each normalized email group so the earliest row can be flagged as the primary email record.
      derived_flags:
        - is_duplicate_email_record
        - is_primary_email_record
      enrichment_fields:
        - country_name
      duplicate_tracking_fields:
        - email_record_count
      suggested_improvements:
        - Test customer_id format
        - Test date validity of `created_at`
        - Add test for malformed emails
        - Add tests for null or malformed `created_at` values.

    columns:
      - name: customer_id
        description: Unique customer identifier number.
        tests:
          - not_null
          - unique

      - name: email
        description: Customer email, normalized with trim, force lowercase.
        tests:
          - not_null

      - name: country_code
        description: Customer 2-letter country code.
        tests:
          # not_null test, as relationship test will not fail on null child values
          - not_null
          - relationships:
              arguments:
                to: ref('country_codes')
                field: country_code

      - name: country_name
        description: Business-friendly country name.

      - name: created_at
        description: Customer creation date.

      - name: email_record_count
        description: Count of email appearance in source customers table.  

      - name: is_duplicate_email_record
        description: Flag if email for customer_id is duplicated/ assigned to any other customer_id.
      
      - name: is_primary_email_record
        description: Flag if customer_id is customer record.
