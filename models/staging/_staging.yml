version: 2

models:

  - name: stg_orders
    description: >
      Clean, deduplicated orders from the staging DQ helper. When a row is
      rejected it is routed to stg_orders__quarantine.
    columns:
      - name: order_id
        description: Source order identifier. Not yet deduplicated.
        tests:
          - not_null
      - name: customer_id
        description: FK to stg_customers.customer_id.
        tests:
          - not_null
      - name: order_date_raw
        description: Raw order date string before try_cast.
      - name: order_date
        description: Parsed order date. NULL when the raw string cannot be cast.
      - name: status
        description: Order status (completed, pending, cancelled, shipped, refunded).
        tests:
          - not_null
          - accepted_values:
              values: ['completed', 'pending', 'cancelled', 'shipped', 'refunded']
      - name: total_amount
        description: Order amount in currency. May be NULL for pending orders.
      - name: currency
        description: ISO currency code.
      - name: updated_at
        description: Source-system update timestamp. May be NULL in source; NULL rows are handled downstream in stg_orders__labeled.

  - name: stg_orders__labeled
    description: >
      Assigns a dq_reason to every order row. NULL means clean. Downstream,
      int_orders_enriched reads WHERE dq_reason IS NULL and stg_orders__quarantine
      reads WHERE dq_reason IS NOT NULL, keeping both views in lock-step.
    columns:
      - name: order_id
        description: Order identifier (duplicates have row_num > 1).
        tests:
          - not_null
      - name: row_num
        description: 1 for the canonical row per order_id, >1 for duplicates.
        tests:
          - not_null
      - name: dq_reason
        description: >
          NULL = clean. Values: duplicate_order_id, invalid_date, future_date,
          stale_date, completed_with_bad_amount, null_amount_unexpected.

  - name: stg_orders__quarantine
    description: >
      Order rows that failed DQ checks, tagged with the reason. Query this model
      to count rejections by reason over time for DQ dashboards or alerting.
    columns:
      - name: order_id
        description: Order identifier of the rejected row.
        tests:
          - not_null
      - name: dq_reason
        description: Why the row was rejected.
        tests:
          - not_null
          - accepted_values:
              values:
                - invalid_date
                - future_date
                - stale_date
                - completed_with_bad_amount
                - null_amount_unexpected
                - duplicate_order_id
      - name: quarantined_at
        description: Build timestamp when the row was routed to quarantine.
        tests:
          - not_null

  - name: stg_customers
    description: >
      Customers with types cast, email normalized, and a shared-email flag.
    columns:
      - name: customer_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: email
        description: Lower-cased, trimmed email address.
      - name: country
        description: ISO country code.
        tests:
          - not_null
      - name: created_at
        description: Account creation date.
      - name: email_is_shared
        description: TRUE when this email also appears on another customer_id.
        tests:
          - not_null

  - name: stg_products
    description: Products lookup. Type-casting only, no business logic.
    columns:
      - name: product_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: product_name
        description: Display name. Renamed from raw `name` for unambiguous joins.
        tests:
          - not_null
      - name: category
        description: Product category.
        tests:
          - not_null
      - name: unit_price
        description: List price in USD.
        tests:
          - positive_amount
