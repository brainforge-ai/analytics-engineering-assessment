version: 2

models:

  - name: stg_orders
    description: >
      Raw orders with types cast and columns renamed. No DQ filtering happens
      here — that logic lives in int_orders__labeled so quarantine and clean
      paths stay in lock-step.
    columns:
      - name: order_id
        description: Source order identifier. Not yet deduplicated.
        tests:
          - not_null
      - name: customer_id
        description: FK to stg_customers.customer_id.
        tests:
          - not_null
      - name: order_date_raw
        description: Raw order date string before try_cast.
      - name: order_date
        description: Parsed order date. NULL when the raw string cannot be cast.
      - name: status
        description: Order status (completed, pending, cancelled, shipped, refunded).
        tests:
          - not_null
          - accepted_values:
              values: ['completed', 'pending', 'cancelled', 'shipped', 'refunded']
      - name: total_amount
        description: Order amount in currency. May be NULL for pending orders.
      - name: currency
        description: ISO currency code.
      - name: updated_at
        description: Source-system update timestamp. May be NULL in source; NULL rows are handled downstream in int_orders__labeled.

  - name: stg_customers
    description: >
      Customers with types cast and email lowercased/trimmed.
    columns:
      - name: customer_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: email
        description: Lower-cased, trimmed email address.
      - name: country
        description: ISO country code.
        tests:
          - not_null
      - name: created_at
        description: Account creation date.

  - name: stg_products
    description: Products lookup. Type-casting only, no business logic.
    columns:
      - name: product_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: product_name
        description: Display name. Renamed from raw `name` for unambiguous joins.
        tests:
          - not_null
      - name: category
        description: Product category.
        tests:
          - not_null
      - name: unit_price
        description: List price in USD.
        tests:
          - positive_amount
