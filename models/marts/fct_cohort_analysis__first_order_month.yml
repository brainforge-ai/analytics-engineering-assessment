version: 2

models:
  - name: fct_cohort_analysis__first_order_month
    description: |
      Table to analyze customer retention following their first order.

      This mart is intentionally scoped to the `first_valid_order_month` cohort
      definition, with one row per cohort start month observed in one later month.

      `months_since_first_order = 0` is intentionally kept as the baseline month.
      It anchors the cohort, shows the original cohort size in the same output
      shape, and makes later observed months easier to interpret.

    meta:
      table_grain: One row per cohort_start_month + observed_month

    columns:
      - name: cohort_start_month
        description: Business-friendly label for the cohort's starting month, such as Jan 2024.
        tests:
          - not_null

      - name: observed_month
        description: Business-friendly label for the month in which that cohort's later activity is being measured, such as Feb 2024.
        tests:
          - not_null

      - name: months_since_first_order
        description: Number of months between the cohort's starting month and the observed month; `0` represents the baseline cohort month.
        tests:
          - not_null

      - name: customers_in_cohort
        description: Number of customers whose first valid order falls in the cohort start month.
        tests:
          - not_null

      - name: active_customers
        description: Number of customers from that cohort with at least one valid order in the observed month.
        tests:
          - not_null

      - name: observed_month_retention_rate
        description: Share of the original cohort that was active in the observed month.
        tests:
          - not_null
