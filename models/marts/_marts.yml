version: 2

models:

  - name: fct_monthly_revenue
    description: >
      Monthly revenue, order count, and AOV by country. Grain: (country, year_month).
      Materialised incrementally with append strategy — each run adds months not yet
      present. Use --full-refresh to correct historical months.
    columns:
      - name: country
        description: Customer country (ISO code).
        tests:
          - not_null
      - name: year_month
        description: "YYYY-MM calendar month."
        tests:
          - not_null
      - name: total_revenue
        description: Sum of total_amount for revenue-recognised orders in the month.
        tests:
          - not_null
          - positive_amount
      - name: order_count
        description: Number of revenue-recognised orders in the month.
        tests:
          - not_null
          - positive_amount
      - name: avg_order_value
        description: total_revenue / order_count.
        tests:
          - not_null
      - name: last_updated_at
        description: Max updated_at of the orders aggregated into this row.
        tests:
          - not_null
      - name: built_at
        description: Timestamp this row was last rebuilt by dbt.

  - name: fct_customer_cohorts
    description: >
      Customer cohort retention. Grain: (cohort_month, months_since_first_order).
      Each customer is assigned to the month of their first revenue-recognised order.
      Cohort was chosen over MoM (only 2 data points) and 30-day rolling (too jittery
      for small per-country volumes on this dataset).
    columns:
      - name: cohort_month
        description: "YYYY-MM of each customer's first revenue-recognised order."
        tests:
          - not_null
      - name: months_since_first_order
        description: "Whole months since the customer's first order. 0 = same month."
        tests:
          - not_null
      - name: cohort_size
        description: Number of customers in the cohort (constant per cohort_month).
        tests:
          - not_null
          - positive_amount
      - name: active_customers
        description: Distinct cohort customers with a revenue order at this offset.
        tests:
          - not_null
          - positive_amount
      - name: retention_rate
        description: active_customers / cohort_size.
        tests:
          - not_null
      - name: cohort_revenue
        description: Sum of total_amount placed by cohort customers at this offset.
        tests:
          - not_null
      - name: avg_order_value
        description: Mean total_amount across cohort orders at this offset.
        tests:
          - not_null
